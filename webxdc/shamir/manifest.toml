# webxdc manifest — spec keys are `name` and `source_code_url`
# (https://webxdc.org/docs/spec/format.html). `entry` / `version` / `summary`
# were non-standard and have been folded into `description`.
# Shares are pushed to the chat over the webxdc API: index.html references webxdc.js,
# which the messenger injects. Without that reference window.webxdc is never
# populated and 'send to peers' silently does nothing (see REVIEW.md XDC-9).
name = "Shamir Secret Sharing"
source_code_url = "https://github.com/shdwelf/Html5-sync-incoming/tree/main/webxdc/shamir"
description = "Split & reconstruct secrets with Shamir's Secret Sharing over GF(256)."
icon = "icon.png"
