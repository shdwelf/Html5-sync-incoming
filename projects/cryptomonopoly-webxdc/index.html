<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cryptomonopoly</title>
<link rel="icon" href="icon.png" type="image/png">
<link rel="stylesheet" href="css/style.css">
<!-- The messenger injects webxdc.js at runtime; per the container spec the file
     itself must NOT be inside the .xdc (build.sh deliberately does not stage it).
     Referencing it is what activates window.webxdc — without this tag the app
     silently falls back to local hot-seat mode inside Delta Chat and never
     syncs. In a plain browser the request 404s harmlessly and
     Transport.createTransport() detects the absence of window.webxdc. -->
<script src="webxdc.js"></script>
</head>
<body>
  <div id="root"></div>
  <!-- No bundled webxdc shim here on purpose: Transport.createTransport() detects
       a real Delta Chat host (window.webxdc) automatically, otherwise it runs a
       local hot-seat game with an optional cross-tab BroadcastChannel mirror. -->
  <script src="js/board.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/transport.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
