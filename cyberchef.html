<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberChef — HTML5 (Renovated Kitchen)</title>
<style>
  :root{
    --bg:#1c1c1e; --panel:#232326; --panel2:#2a2a2e; --line:#3a3a3f;
    --fg:#dcdcdc; --muted:#9a9a9e; --accent:#c39df3; --accent2:#7b5ea7;
    --green:#5ce4a0; --red:#ff6b6b; --inputbg:#17171a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:16px; padding:8px 14px;
    background:linear-gradient(90deg,#2a1b46,#232326 40%);
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  header .brand{font-size:20px;font-weight:700;letter-spacing:1px;color:#fff;}
  header .brand span{color:var(--accent);}
  header .sub{color:var(--muted);font-size:12px;}
  header .spacer{flex:1;}
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    padding:7px 12px;border-radius:4px;cursor:pointer;font-size:12px;
  }
  .btn:hover{border-color:var(--accent);}
  #bake{
    background:var(--green);border:none;color:#083b24;font-weight:700;font-size:13px;
    padding:8px 22px;border-radius:4px;cursor:pointer;
  }
  #bake:hover{filter:brightness(1.1);}
  main{flex:1;display:flex;min-height:0;}
  section{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line);}
  .panel-head{
    padding:8px 10px;font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);
    background:var(--panel2);border-bottom:1px solid var(--line);text-transform:uppercase;
    display:flex;align-items:center;justify-content:space-between;
  }
  #operations{width:220px;flex-shrink:0;background:var(--panel);}
  #ops-search{margin:8px;padding:7px 9px;background:var(--inputbg);border:1px solid var(--line);color:var(--fg);border-radius:4px;outline:none;font-size:13px;}
  #ops-search:focus{border-color:var(--accent);}
  #ops-list{flex:1;overflow-y:auto;padding:4px 6px;}
  .op{padding:8px 9px;border-radius:4px;cursor:pointer;font-size:13px;border:1px solid transparent;}
  .op:hover{background:var(--panel2);border-color:var(--line);}
  .op .cat{font-size:10px;color:var(--muted);text-transform:uppercase;}
  #recipe{width:330px;flex-shrink:0;background:var(--panel);}
  #recipe-list{flex:1;overflow-y:auto;padding:8px;}
  .r-item{background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin-bottom:8px;padding:8px;}
  .r-item .r-top{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .r-item .r-name{font-weight:600;font-size:13px;flex:1;}
  .r-item .r-ops{display:flex;gap:4px;}
  .iconbtn{background:var(--inputbg);border:1px solid var(--line);color:var(--muted);width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:12px;line-height:1;}
  .iconbtn:hover{color:var(--fg);border-color:var(--accent);}
  .iconbtn.del:hover{color:var(--red);border-color:var(--red);}
  .r-args{padding:2px 0;}
  .arg{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
  .arg label{font-size:11px;color:var(--muted);width:92px;flex-shrink:0;text-align:right;}
  .arg input[type=text],.arg input[type=number],.arg select{
    flex:1;padding:5px 7px;background:var(--inputbg);border:1px solid var(--line);color:var(--fg);border-radius:4px;outline:none;font-size:13px;
  }
  .arg input:focus,.arg select:focus{border-color:var(--accent);}
  #recipe-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 10px;}
  #out{flex:1;background:var(--panel);border-right:none;}
  #tabs{display:flex;}
  .tab{padding:8px 18px;font-size:12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
  .tab.active{color:var(--fg);border-bottom-color:var(--accent);}
  #ioarea{flex:1;display:flex;flex-direction:column;min-height:0;}
  .io-wrap{flex:1;display:flex;flex-direction:column;min-height:0;}
  textarea{
    flex:1;resize:none;background:var(--inputbg);color:#e8e8e8;border:none;outline:none;
    font-family:"Consolas","Menlo","Courier New",monospace;font-size:13px;padding:12px;
  }
  #out-error{display:none;background:#2a0f0f;color:var(--red);padding:8px 12px;font-family:monospace;font-size:13px;border-top:1px solid var(--red);white-space:pre-wrap;}
  footer{display:flex;align-items:center;gap:10px;padding:4px 14px;background:var(--panel2);border-top:1px solid var(--line);font-size:12px;color:var(--muted);}
  footer .spacer{flex:1;}
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#3a3a3f;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  @media(max-width:900px){
    #operations{width:150px;} #recipe{width:240px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">Cyber<span>Chef</span></div>
  <div class="sub">HTML5 · 106 recipes · BIP39 mnemonics, BIP44 HD wallets &amp; Haiku</div>
  <div class="spacer"></div>
  <button class="btn" id="btn-clear">Clear Recipe</button>
  <button class="btn" id="btn-load-examples">Load Examples</button>
  <button class="btn" id="btn-reset-demo">Reset Input</button>
  <button class="btn" id="btn-share-recipe" title="Share current recipe via WebXDC">Share Recipe</button><button id="bake">BAKE</button>
</header>

<main>
  <section id="operations">
    <div class="panel-head">Operations</div>
    <input id="ops-search" type="text" placeholder="Search...">
    <div id="ops-list"></div>
  </section>

  <section id="recipe">
    <div class="panel-head"><span>Recipe</span></div>
    <div id="recipe-list"><div id="recipe-empty">Click an operation on the left to add it to the recipe.<br>BAKE runs them in order top → bottom.</div></div>
  </section>

  <section id="out">
    <div class="panel-head" id="tabs">
      <div class="tab active" data-tab="input">Input</div>
      <div class="tab" data-tab="output">Output</div>
    </div>
    <div id="ioarea">
      <div class="io-wrap" id="wrap-input"><textarea id="input" spellcheck="false"></textarea></div>
      <div class="io-wrap" id="wrap-output" style="display:none">
        <textarea id="output" readonly spellcheck="false"></textarea>
        <div id="preview" style="display:none;flex:1;overflow:auto;background:#0e0e10;padding:12px;text-align:center;"></div>
      </div>
      <div id="out-error"></div>
    </div>
  </section>
</main>

<footer>
  <span id="foot-info">Ready.</span>
  <span class="spacer"></span>
  <span id="recipe-count"></span>
</footer>

<script>
/* ============================================================
   HELPERS
============================================================ */
const $=id=>document.getElementById(id);
function utf8Encode(s){return new TextEncoder().encode(s);}
function utf8Decode(b){return new TextDecoder().decode(b);}
function hexFromBytes(b){return Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join('');}
function bytesFromHex(h){h=h.replace(/[^0-9a-fA-F]/g,'');if(h.length%2)h='0'+h;const b=[];for(let i=0;i<h.length;i+=2)b.push(parseInt(h.substr(i,2),16));return new Uint8Array(b);}
function b64FromBytes(bytes){
  const b64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  let out="";const arr=Array.from(bytes);
  for(let i=0;i<arr.length;i+=3){
    const n=(arr[i]<<16)|((arr[i+1]??0)<<8)|(arr[i+2]??0);
    out+=b64[(n>>18)&63]+b64[(n>>12)&63]+b64[(n>>6)&63]+b64[n&63];
  }
  const pad=(3-arr.length%3)%3; return out.slice(0,out.length-pad)+"=".repeat(pad);
}
function bytesFromB64(s){
  const b64="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
  s=s.replace(/[^A-Za-z0-9+/=]/g,''); s=s.replace(/=+$/,'');
  const out=[];let buf=0,bits=0;
  for(const c of s){buf=(buf<<6)|b64.indexOf(c);bits+=6;if(bits>=8){bits-=8;out.push((buf>>bits)&0xff);}}
  return new Uint8Array(out);
}
function isLetter(c){return (c>='A'&&c<='Z')||(c>='a'&&c<='z');}
function toUpperLetters(s){return s.toUpperCase().replace(/[^A-Z]/g,'');}

/* ============================================================
   OPERATION REGISTRY
============================================================ */
const OPERATIONS=[];
function addOp(id,name,category,desc,args,run){OPERATIONS.push({id,name,category,desc,args,run});}

/* ============ ORIGINAL SIX ============ */

/* 1. Caesar */
addOp('caesar','Caesar Cipher','Classical',
  'Shifts each letter by a fixed number. E=(p+K) mod 26, D=(c-K) mod 26.',
  [
    {key:'shift',label:'Shift',type:'number',default:'3'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    let k=((parseInt(args.shift)||0)%26+26)%26; if(args.mode==='decrypt')k=(26-k)%26;
    return text.split('').map(ch=>{
      const c=ch.charCodeAt(0);
      if(c>=65&&c<=90)return String.fromCharCode(65+((c-65+k)%26+26)%26);
      if(c>=97&&c<=122)return String.fromCharCode(97+((c-97+k)%26+26)%26);
      return ch;
    }).join('');
  });

/* 2. Vigenère */
addOp('vigenere','Vigenère Cipher','Classical',
  'Repeating-key Caesar. E=(p_i+k\'(i)) mod 26, D=(c_i-k\'(i)) mod 26.',
  [
    {key:'key',label:'Key',type:'text',default:'KEY'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    const key=args.key.replace(/[^a-zA-Z]/g,'').toUpperCase();
    if(!key.length)return text;
    const ks=key.split('').map(c=>c.charCodeAt(0)-65); let j=0;
    return text.split('').map(ch=>{
      const c=ch.charCodeAt(0),up=(c>=65&&c<=90),lo=(c>=97&&c<=122);
      if(!up&&!lo)return ch;
      const base=up?65:97,p=c-base,k=ks[j%ks.length]; j++;
      const out=args.mode==='decrypt'?(p-k+26)%26:(p+k)%26;
      return String.fromCharCode(base+out);
    }).join('');
  });

/* 3. Gronsfeld */
addOp('gronsfeld','Gronsfeld Cipher','Classical',
  'Vigenère with a numeric (0-9) key.',
  [
    {key:'key',label:'Key',type:'text',default:'123'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    const ks=args.key.replace(/[^0-9]/g,'').split('').map(Number); if(!ks.length)return text;
    let j=0;
    return text.split('').map(ch=>{
      const c=ch.charCodeAt(0),up=(c>=65&&c<=90),lo=(c>=97&&c<=122);
      if(!up&&!lo)return ch;
      const base=up?65:97,p=c-base,k=ks[j%ks.length]; j++;
      const out=args.mode==='decrypt'?(p-k+26)%26:(p+k)%26;
      return String.fromCharCode(base+out);
    }).join('');
  });

/* 4. One-Time Pad / XOR */
addOp('xor','One-Time Pad / XOR','Classical',
  'Bitwise XOR of input bytes with key bytes (key repeats). XOR is self-inverse.',
  [
    {key:'key',label:'Key',type:'text',default:'key'},
    {key:'infmt',label:'Input fmt',type:'select',default:'text',options:[['text','Text'],['hex','Hex']]},
    {key:'outfmt',label:'Output fmt',type:'select',default:'text',options:[['text','Text'],['hex','Hex']]}
  ],
  function(text,args){
    const keyBytes=args.key.split('').map(ch=>ch.charCodeAt(0)&0xff);
    if(!keyBytes.length)return text;
    let bytes=args.infmt==='hex'?bytesFromHex(text):new Uint8Array(utf8Encode(text));
    const out=bytes.map((b,i)=>b^keyBytes[i%keyBytes.length]);
    return args.outfmt==='hex'?hexFromBytes(out):utf8Decode(out);
  });

/* 5. VIC Straddling Checkerboard */
const VIC_ROW0="ET-ONR-ISA", VIC_ROW_A="BCDFGHJKLM", VIC_ROW_B="PQUVWXYZ./", VIC_BLANKS=[2,6];
function vicEncodeTable(){
  const e={};
  for(let i=0;i<VIC_ROW0.length;i++)if(VIC_ROW0[i]!=='-')e[VIC_ROW0[i]]=String(i);
  for(let i=0;i<VIC_ROW_A.length;i++)e[VIC_ROW_A[i]]=String(VIC_BLANKS[0])+i;
  for(let i=0;i<VIC_ROW_B.length;i++)e[VIC_ROW_B[i]]=String(VIC_BLANKS[1])+i;
  return e;
}
function vicDecodeTable(){
  const d={};
  for(let i=0;i<VIC_ROW0.length;i++)if(VIC_ROW0[i]!=='-')d[String(i)]=VIC_ROW0[i];
  for(let i=0;i<VIC_ROW_A.length;i++)d[String(VIC_BLANKS[0])+i]=VIC_ROW_A[i];
  for(let i=0;i<VIC_ROW_B.length;i++)d[String(VIC_BLANKS[1])+i]=VIC_ROW_B[i];
  return d;
}
addOp('vic','VIC Cipher','Classical',
  'Straddling checkerboard. Encrypt: text→digits; Decrypt: digits→text. Grid holes at 2 &amp; 6.',
  [
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Text → Digits'],['decrypt','Digits → Text']]}
  ],
  function(text,args){
    if(args.mode==='decrypt'){
      const dec=vicDecodeTable(); const s=text.replace(/[^0-9]/g,'');
      let out='',i=0;
      while(i<s.length){
        const d=s[i];
        if(d===String(VIC_BLANKS[0])||d===String(VIC_BLANKS[1])){
          const tok=s.substr(i,2);
          if(dec[tok]!==undefined){out+=dec[tok];i+=2;} else{out+='?';i+=1;}
        } else { out+=(dec[d]!==undefined)?dec[d]:'?'; i+=1; }
      }
      return out;
    }else{
      const enc=vicEncodeTable();
      return text.split('').map(ch=>{const u=ch.toUpperCase();return (enc[u]!==undefined)?enc[u]:(ch===' '?' ':ch);}).join('');
    }
  });

/* 6. RSA */
function bigGcd(a,b){a=a<0n?-a:a;b=b<0n?-b:b;while(b){[a,b]=[b,a%b];}return a;}
function bigModExp(base,exp,mod){base%=mod;let r=1n;while(exp>0n){if(exp%2n===1n)r=(r*base)%mod;base=(base*base)%mod;exp>>=1n;}return r;}
function bigModInv(a,m){a=((a%m)+m)%m;const m0=m;let y=0n,x=1n;if(m===1n)return 0n;while(a>1n){const q=a/m;let t=m;m=a%m;a=t;t=y;y=x-q*y;x=t;}if(x<0n)x+=m0;return x;}
addOp('rsa','RSA Encrypt/Decrypt','Public Key',
  'Public (e,n), private (d,n). Small p,q demo. Message must be 0 ≤ m < n.',
  [
    {key:'p',label:'Prime p',type:'number',default:'3'},
    {key:'q',label:'Prime q',type:'number',default:'11'},
    {key:'e',label:'Pub exp e',type:'number',default:'3'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt (m → c)'],['decrypt','Decrypt (c → m)']]}
  ],
  function(text,args){
    const P=BigInt(args.p||0),Q=BigInt(args.q||0),E=BigInt(args.e||0);
    if(P<2n||Q<2n||P===Q)throw new Error('p and q must be distinct primes ≥ 2');
    const n=P*Q,phi=(P-1n)*(Q-1n);
    if(bigGcd(E,phi)!==1n)throw new Error('e must be coprime to φ(n)='+phi.toString());
    const D=bigModInv(E,phi);
    let v; try{v=BigInt(text.trim());}catch(e){throw new Error('Input must be an integer');}
    if(v<0n)v=((v%n)+n)%n;
    if(v>=n)throw new Error('Message must be < n = '+n.toString());
    return bigModExp(v,args.mode==='encrypt'?E:D,n).toString();
  });

/* ============ NEW CLASSICAL ============ */

/* Atbash */
addOp('atbash','Atbash Cipher','Classical','Monoalphabetic: A↔Z, B↔Y… Self-inverse.',
  [], function(text,args){
    return text.split('').map(ch=>{
      const c=ch.charCodeAt(0);
      if(c>=65&&c<=90)return String.fromCharCode(90-(c-65));
      if(c>=97&&c<=122)return String.fromCharCode(122-(c-97));
      return ch;
    }).join('');
  });

/* ROT13 */
addOp('rot13','ROT13','Classical','Caesar shift by 13. Self-inverse.',
  [], function(text,args){
    return text.split('').map(ch=>{
      const c=ch.charCodeAt(0);
      if(c>=65&&c<=90)return String.fromCharCode(65+((c-65+13)%26));
      if(c>=97&&c<=122)return String.fromCharCode(97+((c-97+13)%26));
      return ch;
    }).join('');
  });

/* Rail Fence */
addOp('railfence','Rail Fence Cipher','Classical','Transposition writing plaintext in a zig-zag across N rails.',
  [
    {key:'rails',label:'Rails',type:'number',default:'3'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    const r=Math.max(2,parseInt(args.rails)||3);
    if(args.mode==='encrypt'){
      const rows=Array.from({length:r},()=>[]);let row=0,dir=1;
      for(const c of text){rows[row].push(c);if(row===0)dir=1;else if(row===r-1)dir=-1;row+=dir;}
      return rows.flat().join('');
    }else{
      const n=text.length;const pos=[];let row=0,dir=1;
      for(let i=0;i<n;i++){pos.push(row);if(row===0)dir=1;else if(row===r-1)dir=-1;row+=dir;}
      const counts=Array(r).fill(0);pos.forEach(p=>counts[p]++);
      let idx=0;const rows=[];for(let rr=0;rr<r;rr++){rows[rr]=text.substr(idx,counts[rr]);idx+=counts[rr];}
      const curs=Array(r).fill(0);let out='';pos.forEach(p=>{out+=rows[p][curs[p]++];});
      return out;
    }
  });

/* Columnar Transposition */
addOp('coltrans','Columnar Transposition','Classical',
  'Write in rows of key-length columns, read columns in key-alphabet order.',
  [
    {key:'key',label:'Key',type:'text',default:'ZEBRAS'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    const key=args.key.replace(/[^a-zA-Z]/g,'');
    if(!key.length)throw new Error('Enter a key');
    const klen=key.length;
    const order=[...key].map((ch,i)=>[ch,i]).sort((a,b)=>a[0].toLowerCase().localeCompare(b[0].toLowerCase())||a[1]-b[1]).map(x=>x[1]);
    if(args.mode==='encrypt'){
      const full=text+'_'.repeat((klen-text.length%klen)%klen);
      const rows=full.length/klen;let out='';
      for(const ci of order){let col='';for(let r=0;r<rows;r++)col+=full[r*klen+ci];out+=col;}
      return out.replace(/_+$/g,'');
    }else{
      const n=text.length;const rows=Math.ceil(n/klen);const cells=rows*klen;
      // reconstruct matrix
      const grid=Array.from({length:rows},()=>Array(klen).fill(''));
      let idx=0;
      for(const ci of order){for(let r=0;r<rows;r++){if(r*klen+ci<n)grid[r][ci]=text[idx++];}}
      let out='';
      for(let r=0;r<rows;r++)for(let c=0;c<klen;c++)out+=grid[r][c];
      return out.replace(/_+$/g,'');
    }
  });

/* Playfair */
addOp('playfair','Playfair Cipher','Classical',
  'Digraph substitution with a 5×5 key square (I/J merged).',
  [
    {key:'key',label:'Key',type:'text',default:'MONARCHY'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    let t=toUpperLetters(text).replace(/J/g,'I');
    const pairs=[];let i=0;
    while(i<t.length){
      if(i===t.length-1){pairs.push(t[i]+'X');i++;}
      else if(t[i]===t[i+1]){pairs.push(t[i]+'X');i++;}
      else{pairs.push(t[i]+t[i+1]);i+=2;}
    }
    let key=toUpperLetters(args.key).replace(/J/g,'I');
    const seen=new Set();let sq='';
    for(const c of key)if(!seen.has(c)){seen.add(c);sq+=c;}
    for(let cc=65;cc<=90;cc++){const c=String.fromCharCode(cc);if(c==='J')continue;if(!seen.has(c)){seen.add(c);sq+=c;}}
    const pos={};[...sq].forEach((c,i)=>pos[c]=[Math.floor(i/5),i%5]);
    let out='';
    for(const [a,b] of pairs){
      const [r1,c1]=pos[a],[r2,c2]=pos[b];
      if(r1===r2) out+=sq[r1*5+((c1+1)%5)]+sq[r2*5+((c2+1)%5)];
      else if(c1===c2) out+=sq[((r1+1)%5)*5+c1]+sq[((r2+1)%5)*5+c2];
      else out+=sq[r1*5+c2]+sq[r2*5+c1];
    }
    return out;
  });

/* Hill 2x2 */
addOp('hill','Hill Cipher (2×2)','Classical',
  'Matrix cipher. Encrypt: C=K·P mod 26. Key given as a,b,c,d (K=[[a,b],[c,d]]).',
  [
    {key:'a',label:'a',type:'number',default:'3'},
    {key:'b',label:'b',type:'number',default:'3'},
    {key:'c',label:'c',type:'number',default:'2'},
    {key:'d',label:'d',type:'number',default:'5'},
    {key:'mode',label:'Mode',type:'select',default:'encrypt',options:[['encrypt','Encrypt'],['decrypt','Decrypt']]}
  ],
  function(text,args){
    const mod=26n;
    let K=[[BigInt(args.a),BigInt(args.b)],[BigInt(args.c),BigInt(args.d)]];
    const det=((K[0][0]*K[1][1]-K[0][1]*K[1][0])%mod+mod)%mod;
    const t=toUpperLetters(text);
    if(args.mode==='decrypt'){
      if(bigGcd(det,mod)!==1n)throw new Error('Key not invertible mod 26 (det='+det.toString()+')');
      const detInv=bigModInv(det,mod);
      K=[[detInv*K[1][1],(mod-detInv*K[0][1]%mod)%mod],
          [(mod-detInv*K[1][0]%mod)%mod,detInv*K[0][0]%mod]];
    }
    let out='';const kk=K.map(r=>r.map(x=>Number(x%mod)));
    for(let i=0;i+1<t.length;i+=2){
      const p1=t.charCodeAt(i)-65,p2=t.charCodeAt(i+1)-65;
      const c1=((kk[0][0]*p1+kk[0][1]*p2)%26+26)%26;
      const c2=((kk[1][0]*p1+kk[1][1]*p2)%26+26)%26;
      out+=String.fromCharCode(c1+65)+String.fromCharCode(c2+65);
    }
    return out;
  });

function utf8Bytes(str){
  const b=[];
  for(let i=0;i<str.length;i++){
    let c=str.codePointAt(i);
    if(c<0x80)b.push(c);
    else if(c<0x800)b.push(0xc0|c>>6,0x80|c&63);
    else if(c<0x10000)b.push(0xe0|c>>12,0x80|(c>>6)&63,0x80|c&63);
    else{b.push(0xf0|c>>18,0x80|(c>>12)&63,0x80|(c>>6)&63,0x80|c&63);i++;}
  }
  return b;
}

function md5hex(str){
  const msg=utf8Bytes(str);
  const bitlen=msg.length*8;
  msg.push(0x80);
  while(msg.length%64!==56)msg.push(0);
  msg.push(bitlen&0xff,(bitlen>>>8)&0xff,(bitlen>>>16)&0xff,(bitlen>>>24)&0xff,0,0,0,0);
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  const rotl=(x,c)=>(x<<c)|(x>>>(32-c));
  for(let i=0;i<msg.length;i+=64){
    const M=[];for(let j=0;j<16;j++)M.push(msg[i+4*j]|(msg[i+4*j+1]<<8)|(msg[i+4*j+2]<<16)|(msg[i+4*j+3]<<24));
    let A=a0,B=b0,C=c0,D=d0;
    for(let g=0;g<64;g++){
      let F,f;
      if(g<16){F=(B&C)|(~B&D);f=g;}
      else if(g<32){F=(D&B)|(~D&C);f=(5*g+1)%16;}
      else if(g<48){F=B^C^D;f=(3*g+5)%16;}

  }
  const hex=x=>{let s='';for(let i=0;i<4;i++)s+=((x>>(i*8))&0xff).toString(16).padStart(2,'0');return s;};
  return hex(a0)+hex(b0)+hex(c0)+hex(d0);

function sha3hex(msg,n){

      '      f(candidate) === stored_hash  ⇒  almost certainly candidate = original',
      '',
      '4. Collisions. Many inputs share one output point (pigeonhole principle',
      '   on finite output space). Strength comes from making collisions',
      '   astronomically hard to FIND (not from them being impossible).',
      '',
      '5. Hash-and-compare is why passwords are stored as hashes and why',
      '   you "verify by re-hashing", never by decrypting.',
      '',
      'Bottom line: the hash is the point you land on, and it is a one-way',
      'ticket. You can only test whether a guess lands on the same point.',
      '',
      'Example (input → SHA3-256 of your text):',
      '   '+sha3hex(t,256)
    ].join('\n');
  });

const BASE32_ALPHA='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function toBase32(bytes){
  let bits=0,value=0,out='';
  for(const b of bytes){value=(value<<8)|b;bits+=8;while(bits>=5){out+=BASE32_ALPHA[(value>>(bits-5))&31];bits-=5;}}
  if(bits>0)out+=BASE32_ALPHA[(value<<(5-bits))&31];
  while(out.length%8!==0)out+='=';
  return out;
}
function fromBase32(s){
  s=s.replace(/=/g,'').toUpperCase().replace(/[^A-Z2-7]/g,'');
  let bits=0,value=0,out=[];
  for(const c of s){value=(value<<5)|BASE32_ALPHA.indexOf(c);bits+=5;if(bits>=8){bits-=8;out.push((value>>bits)&0xff);}}
  return out;
}

const ZW={one:'\u200b',zero:'\u200c',marker:'\u200d'};
function zeroWidthEncode(secret,cover){
  const bits=[];for(const ch of secret){let c=ch.codePointAt(0);for(let b=15;b>=0;b--)bits.push((c>>b)&1);}
  return cover.replace(/\s+$/,'')+'\u200d'+bits.map(x=>x?ZW.one:ZW.zero).join('')+'\u200d';
}
function zeroWidthDecode(t){
  if(!t.includes('\u200d'))return '(no hidden message found)';
  const parts=t.split('\u200d');
  let bin='';
  for(const p of parts){
    for(const ch of p){if(ch===ZW.one)bin+='1';else if(ch===ZW.zero)bin+='0';}
  }
  let out='';for(let i=0;i+16<=bin.length;i+=16){const code=parseInt(bin.substr(i,16),2);out+=String.fromCodePoint(code);}
  return out||'(no hidden message found)';
}

/* ============ STEREOGRAM ============ */
function makeStereogram(text,W,H){
  const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  // depth map from text
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#000';ctx.font='bold '+Math.round(H*0.35)+'px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(text,W/2,H/2);
  const img=ctx.getImageData(0,0,W,H);
  const depth=new Uint8Array(W*H);
  for(let i=0;i<W*H;i++)depth[i]=img.data[i*4]<128?Math.round(H*0.12):0;
  // random-dot stereogram
  const out=ctx.createImageData(W,H);
  const period=W/3|0;
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      let idx=(y*W+x)*4;
      if(x<period){
        const r=Math.random()*256|0;out.data[idx]=r;out.data[idx+1]=r;out.data[idx+2]=r;out.data[idx+3]=255;
      }else{
        const shift=(period>>1)+depth[y*W+x];
        const sx=(x>=shift)?x-shift:x-period;
        const si=(y*W+sx)*4;
        out.data[idx]=out.data[si];out.data[idx+1]=out.data[si+1];out.data[idx+2]=out.data[si+2];out.data[idx+3]=255;
      }
    }
  }
  ctx.putImageData(out,0,0);
  return canvas.toDataURL('image/png');
}

function tokBool(src){
  const toks=[];let i=0;const words=['AND','OR','XOR','NOT'];
  while(i<src.length){
    const ch=src[i];
    if(/\s/.test(ch)){i++;continue;}
    const two=src.substr(i,2);
    if(two==='&&'||two==='||'||two==='^^'){toks.push(two==='&&'?'AND':two==='||'?'OR':'XOR');i+=2;continue;}
    if(ch==='&'){toks.push('AND');i++;continue;}
    if(ch==='|'){toks.push('OR');i++;continue;}
    if(ch==='^'){toks.push('XOR');i++;continue;}
    if(ch==='!'||ch==='~'){toks.push('NOT');i++;continue;}
    if(ch==='('||ch===')'){toks.push(ch);i++;continue;}
    if(ch==='0'||ch==='1'){toks.push(ch);i++;continue;}
    const m=src.substr(i).match(/[A-Za-z]+/);
    if(m){const w=m[0].toUpperCase();i+=m[0].length;toks.push(w);continue;}
    i++;
  }
  return toks;
}
function parseBool(toks){
  let pos=0;let vals={};const words=['AND','OR','XOR','NOT'];
  function expr(){let l=term();while(pos<toks.length&&toks[pos]==='OR'){pos++;l=l|term();}return l;}
  function term(){let l=factor();while(pos<toks.length&&toks[pos]==='XOR'){pos++;l=l^factor();}return l;}
  function factor(){let l=primary();while(pos<toks.length&&toks[pos]==='AND'){pos++;l=l&primary();}return l;}
  function primary(){const t=toks[pos++];if(t==='NOT')return primary()^1;if(t==='('){const v=expr();pos++;return v;}if(t==='0'||t==='1')return +t;return vals[t];}
  const vars=[];for(const t of toks)if(/^[A-Z][A-Z0-9]*$/.test(t)&&!words.includes(t)&&!vars.includes(t))vars.push(t);
  return {eval:(a)=>{vals=a;pos=0;return expr();},vars};
}
addOp('icTruth','IC: Truth Table Generator','Electronics',
  'Generate a truth table for a Boolean expression. Use AND/OR/XOR/NOT (or & | ^ !), variables A-Z, e.g. (A AND B) OR NOT C.',
  [{key:'expr',label:'Expression',type:'text',default:'(A AND B) OR NOT C'}],
  function(text,args){
    const toks=tokBool(args.expr);
    const {eval:ev,vars}=parseBool(toks);
    if(!vars.length)return 'No variables found.';
    const lines=[vars.join('  ')+'  |  '+args.expr];
    lines.push(vars.map(()=>'-').join('  ')+'  +  '+'-'.repeat(args.expr.length));
    const n=vars.length;
    for(let m=0;m<(1<<n);m++){
      const assign={};for(let v=0;v<n;v++)assign[vars[v]]=(m>>(n-1-v))&1;
      lines.push(vars.map(v=>assign[v]).join('  ')+'  |  '+ev(assign));
    }
    return lines.join('\n');
  });

function bfRun(prog,stdin){
  const t=new Uint8Array(30000);let p=0,ip=0,si=0,out='';
  const match=[];const stack=[];
  for(let i=0;i<prog.length;i++){
    if(prog[i]==='[')stack.push(i);
    else if(prog[i]===']'){if(!stack.length)throw new Error('unmatched ] at '+i);const o=stack.pop();match[o]=i;match[i]=o;}
  }
  if(stack.length)throw new Error('unmatched [');
  let steps=0;
  while(ip<prog.length){
    if(++steps>100000000)throw new Error('Execution limit reached (10^8 steps)');
    const c=prog[ip];
    if(c==='>')p++;
    else if(c==='<')p--;
    else if(c==='+')t[p]=(t[p]+1)&255;
    else if(c==='-')t[p]=(t[p]+255)&255;
    else if(c==='.')out+=String.fromCharCode(t[p]);
    else if(c===',')t[p]=si<stdin.length?stdin.charCodeAt(si++)&255:0;
    else if(c==='['){if(t[p]===0)ip=match[ip];}
    else if(c===']'){if(t[p]!==0)ip=match[ip];}
    ip++;
  }
  return out;
}

addOp('vizPip','Visualization: Move the Pip','Visualization',

      __text:'0, 0',

          for(let gy=0;gy<=H;gy+=H/6){c.beginPath();c.moveTo(0,gy);c.lineTo(W,gy);c.stroke();}

addOp('rule110','Rule 110 (Turing complete)','Visualization',
  '1D cellular automaton, proven Turing-complete. Renders generations of the pattern from a single seed bit.',
  [
    {key:'gens',label:'Generations',type:'number',default:'40'},
    {key:'width',label:'Width',type:'number',default:'120'}
  ],
  function(text,args){
    const gens=Math.min(200,Math.max(2,parseInt(args.gens)||40));
    const w=Math.min(400,Math.max(20,parseInt(args.width)||120));
    let row=Array(w).fill(0);row[Math.floor(w/2)]=1;
    const rows=[];
    for(let g=0;g<gens;g++){
      rows.push(row.slice());
      const next=[];
      for(let i=0;i<w;i++){
        const l=row[(i-1+w)%w],c=row[i],r=row[(i+1)%w];
        next.push((0b01101110>>((l<<2)|(c<<1)|r))&1);
      }
      row=next;
    }
    const H=Math.max(100,gens*2),Cw=Math.max(100,w*2);
    const canvas=document.createElement('canvas');canvas.width=Cw;canvas.height=H;
    const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,Cw,H);
    ctx.fillStyle='#c39df3';
    const sx=Cw/w,sy=H/gens;
    for(let g=0;g<gens;g++)for(let i=0;i<w;i++)if(rows[g][i])ctx.fillRect(i*sx,g*sy,sx+1,sy+1);
    const url=canvas.toDataURL('image/png');
    const ascii=rows.map(r=>r.map(x=>x?'#':' ').join('')).join('\n');
    return {
      __visual:true,
      __html:'<div style="max-width:640px;margin:0 auto;"><img src="'+url+'" style="width:100%;image-rendering:pixelated;border-radius:6px;"><div style="color:#9a9a9e;font-size:12px;margin-top:6px;">Rule 110 — '+gens+' generations · Turing-complete (proved by Matthew Cook, 2004). First rows (ASCII):</div><pre style="text-align:left;font-size:10px;line-height:1;color:#7b5ea7;">'+ascii.slice(0,500)+'</pre></div>',
      __text:'Rule 110 ('+gens+' gens x '+w+' cells)',
      __init:null
    };
  });

      }

============================================================ */
const X25519_P=BigInt('57896044618658097711785492504343953926634992332820282019728792003956564819949');

/* ---- Ed25519 ---- */
const ED_L=BigInt('7237005577332262213973186563042994240857116359379907606001950938285454250989');
const ED_D=BigInt('37095705934669439343138083508754565189542113879843219016388785533085940283555');
const ED_BX=BigInt('15112221349535400772501151409588531511454012693041857206046113283949847762202');

function ecCurve(a,b,p,Gx,Gy){
  const mod=x=>{x=x%p;if(x<0n)x+=p;return x;};

  return {add,mul,mod};

  if(id==='256b') return [0,0,0,80,80,0,1,3,3,2,10,0,1,20,1,3,3,3,30,1,3,4,40,1,3,2,50,0,4,20,1,3,8,60,1,3,2,70,1,3,7,80,1,3,2,90,1,3,5,100,1,3,2,110,1,3,9,120,1,3,2,130,1,3,3,140,1,3,2,150,1,3,6,160,1,3,2,170,1,3,4,180,1,3,2,190,1,3,8,200,1,3,2,210,1,3,1,220,1,3,2,230,1,3,7,240,1,3,2,250,2,2,0];
  if(id==='64b') return [0,0,0,40,40,0,1,4,0,1,6,3,3,20,1,3,9,40,1,3,2,60,1,3,8,80,1,3,2,100,1,3,5,120,1,3,2,140,1,3,7,160,1,3,2,180,1,3,4,200,1,3,2,220,1,3,6,240,2,2,0];
  return [0,0,0,1,1,0,2,4,2,2,0]; // 16b
}
function compileToWasm(prog){
  // build a minimal WASM module: runs a loop calling env.out(x,y,c)
  // We encode the bytecode into a WASM data section and a loop that reads it.
  // For demo, emit a small WASM that just returns; the JS VM executes the intros.
  // (real compilation is conceptual; we run via VM for smooth canvas rendering)
  return prog;
}
function runTinyIntro(canvas,id,status){
  const ctx=canvas.getContext('2d');const W=canvas.width,H=canvas.height;const prog=tinyIntroBytecode(id);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  let pc=0,t=0;
  function step(){
    if(pc>=prog.length){pc=0;}
    const op=prog[pc],arg=prog[pc+1];pc+=2;
    if(op===0){const x=prog[pc],y=prog[pc+1],c=prog[pc+2];pc+=3;ctx.fillStyle='hsl('+(c*36+t)%360+',90%,60%)';ctx.fillRect((x*(W/256))|0,(y*(H/256))|0,4,4);}
    else if(op===1){ /*color*/ }
    else if(op===2){pc=arg;if(pc>=prog.length)pc=0;}
    t=(t+1)&255;
    status.textContent=id+' intro running · tick '+t;
    requestAnimationFrame(step);
  }
  step();
}

/* ============================================================
   SHAMIR SECRET SHARING (GF-256)
============================================================ */
const SS_POLY=0x11b;
function ssMul(a,b){let r=0;while(b){if(b&1)r^=a;b>>=1;a=(a<<1)^((a&0x80)?SS_POLY:0);}return r&0xff;}
const SS_EXP=new Array(510),SS_LOG=new Array(256);
(function(){let x=1;for(let i=0;i<255;i++){SS_EXP[i]=x;SS_LOG[x]=i;x=ssMul(x,3);}for(let i=255;i<510;i++)SS_EXP[i]=SS_EXP[i-255];})();
function ssMulT(a,b){if(a===0||b===0)return 0;return SS_EXP[SS_LOG[a]+SS_LOG[b]];}
function ssDiv(a,b){if(b===0)throw new Error('div by zero');if(a===0)return 0;return SS_EXP[(SS_LOG[a]-SS_LOG[b]+255)%255];}
function ssSplit(secretBytes,n,k){
  if(k<2||k>n)throw new Error('Need 2 <= K <= N');
  if(n>255)throw new Error('N must be <= 255');
  const used=new Set(),xs=[];
  for(let i=0;i<n;i++){let x;do{x=1+Math.floor(Math.random()*255);}while(used.has(x));used.add(x);xs.push(x);}
  const bytes=Array.from(secretBytes);
  const polys=[];
  for(let bi=0;bi<bytes.length;bi++){
    const c=new Array(k);c[0]=bytes[bi];
    for(let ci=1;ci<k;ci++)c[ci]=crypto.getRandomValues(new Uint8Array(1))[0];
    polys.push(c);
  }
  const shares=[];
  for(let s=0;s<n;s++){
    const x=xs[s];const y=new Uint8Array(bytes.length);
    for(let bi=0;bi<bytes.length;bi++){
      const c=polys[bi];let v=c[k-1];
      for(let ci=k-2;ci>=0;ci--)v=ssMulT(v,x)^c[ci];
      y[bi]=v;
    }
    shares.push({x,y});
  }
  return shares;
}
function ssCombine(shares,k){
  if(shares.length<k)throw new Error('Need at least '+k+' shares');
  const sel=shares.slice(0,k);const len=sel[0].y.length;
  const secret=new Uint8Array(len);
  for(let bi=0;bi<len;bi++){
    let result=0;
    for(let j=0;j<k;j++){
      const xj=sel[j].x,yj=sel[j].y[bi];let li=1;
      for(let m=0;m<k;m++){
        if(m===j)continue;
        li=ssMulT(li,ssDiv(sel[m].x,(xj^sel[m].x)));
      }
      result^=ssMulT(yj,li);
    }
    secret[bi]=result;
  }
  return secret;
}
function ssShareHex(sh){const b=[sh.x];for(let i=0;i<sh.y.length;i++)b.push(sh.y[i]);return hexFromBytes(b);}
function ssParseHex(h){const b=bytesFromHex(h);return {x:b[0],y:b.slice(1)};}
addOp('shamir','Shamir Secret Sharing','Secret Sharing','Split a secret into N shares (threshold K to reconstruct) using polynomial interpolation over GF(256). Any K of N shares recover the secret; K-1 reveal nothing.',[
  {key:'mode',label:'Mode',type:'select',default:'split',options:[['split','Split secret'],['combine','Combine shares']]},
  {key:'n',label:'Shares (N)',type:'number',default:'5'},
  {key:'k',label:'Threshold (K)',type:'number',default:'3'},
  {key:'secret',label:'Secret (split)',type:'text',default:'my super secret passphrase'},
  {key:'hex',label:'Secret is hex',type:'checkbox',default:false}
],function(t,a){
  if(a.mode==='split'){
    const N=parseInt(a.n)||5,K=parseInt(a.k)||3;
    const secText=a.secret!==''?a.secret:t;
    const secretBytes=a.hex?bytesFromHex(secText):Array.from(utf8Encode(secText));
    if(!secretBytes.length)throw new Error('Secret is empty');
    const shares=ssSplit(secretBytes,N,K);
    const lines=['SHAMIR SECRET SHARING — split into '+N+' shares (K='+K+' to recover)','Secret ('+secretBytes.length+' bytes)','',];
    shares.forEach((sh,i)=>lines.push('Share '+(i+1)+': '+ssShareHex(sh)));
    lines.push('','Reconstruct by pasting ANY '+K+' shares into "Combine".');
    return lines.join('\n');
  }else{
    const shareLines=(t||'').split(/[\r\n]+/).map(s=>s.trim()).filter(s=>s&&!s.startsWith('Share')&&!s.startsWith('SHAMIR')&&!s.startsWith('Recon')&&!s.startsWith('Secret'));
    // extract hex tokens that look like shares (even-length hex, first byte = index)
    const hexTokens=[];for(const ln of shareLines){const m=ln.match(/\b([0-9a-fA-F]{2,})\b/g);if(m)hexTokens.push(...m);}
    if(hexTokens.length<2)throw new Error('Paste at least 2 share hex values');
    const shares=hexTokens.map(h=>ssParseHex(h));
    const k=shares.length;
    const secret=ssCombine(shares,k);
    return 'Recovered secret ('+k+' shares, '+secret.length+' bytes):\n\n'+utf8Decode(new Uint8Array(secret))+'\n\n(hex: '+hexFromBytes(secret)+')';
  }
});

============================================================ */
const WXC = window.webxdc || null;
function serializeRecipe(){
  return recipe.map(item=>({id:item.op.id, args:item.args}));
}
function recipeToText(){
  if(!recipe.length) return 'CyberChef: (empty recipe)';
  const lines=['CyberChef recipe ['+recipe.length+' steps]:'];
  recipe.forEach((it,i)=>{lines.push((i+1)+'. '+it.op.name+'  '+(Object.keys(it.args).length?JSON.stringify(it.args):''));});
  return lines.join('\n');
}
function applyRecipeJson(serial){
  if(!Array.isArray(serial)||!serial.length) return 0;
  recipe=[];
  serial.forEach(({id,args})=>{
    const op=OPERATIONS.find(o=>o.id===id);
    if(op){const item={uid:++opIdCounter,op,args:{}};op.args.forEach(a=>item.args[a.key]=(args&&args[a.key]!==undefined)?args[a.key]:a.default);recipe.push(item);}
  });
  renderRecipe();bake();
  return recipe.length;
}
// banner when running as webxdc
if(WXC && WXC.selfName){
  const b=document.createElement('div');
  b.textContent='WebXDC · connected as '+WXC.selfName;
  b.style.cssText='position:fixed;bottom:28px;right:10px;z-index:50;background:#0e3a2a;color:#5ce4a0;border:1px solid #1d6a49;padding:4px 10px;border-radius:20px;font-size:11px;';
  document.body.appendChild(b);
}
// Share current recipe
function shareRecipe(){
  if(!recipe.length){alert('Build a recipe first, then share.');return;}
  if(!WXC){alert('WebXDC API not available here (open as an .xdc in Delta Chat).');return;}
  const serial=serializeRecipe();
  const txt=recipeToText();
  // broadcast to peers in this chat
  try{ WXC.sendUpdate({payload:{type:'cyberchef_recipe', recipe:serial, from: (WXC.selfName||'peer')}}, 'Sharing recipe…'); }catch(e){}
  // also offer send to another chat
  if(WXC.sendToChat){
    if(confirm('Broadcast to this chat AND send to another chat?')) {
      WXC.sendToChat({ text: txt, text_filename:'cyberchef-recipe.txt' });
    }
  }
}
// Receive recipes
if(WXC){
  WXC.setUpdateListener(function(update){
    const p=(update&&update.payload)||{};
    if(p.type==='cyberchef_recipe' && Array.isArray(p.recipe)){
      const n=applyRecipeJson(p.recipe);
      if(n>0 && confirm('Received a recipe from '+(p.from||'a peer')+' ('+n+' steps). Load it?')){
        applyRecipeJson(p.recipe);
      }
    }
  });
}
$('btn-share-recipe').addEventListener('click',shareRecipe);

async function bip32Master(seed){const I=await bipHmac512('Bitcoin seed',seed);return{key:I.slice(0,32),chain:I.slice(32),depth:0,index:0,parentFP:[0,0,0,0]};}
function ser32(i){return[0,0,0,0].map((_,k)=>(i>>(8*(3-k)))&0xff);}
async function bipHash160(pubBytes){return ripemd160(await bipSha256(pubBytes));}
async function ckdPriv(node,index){
  const hardened=index>=0x80000000;const kpar=node.key;let data;
  if(hardened)data=[0].concat(kpar).concat(ser32(index));
  else{const P=secpMul([SECP_GX,SECP_GY],secpMod(BigInt('0x'+bytesToHex(kpar))));data=secpPointSerialize(P).concat(ser32(index));}
  const I=await bipHmac512(node.chain,data);const IL=I.slice(0,32),IR=I.slice(32);
  const ck=(BigInt('0x'+bytesToHex(IL))+BigInt('0x'+bytesToHex(kpar)))%SECP_N;
  const pubP=secpPointSerialize(secpMul([SECP_GX,SECP_GY],secpMod(BigInt('0x'+bytesToHex(kpar)))));
  const parentFP=(await bipHash160(pubP)).slice(0,4);
  return{key:hexToBytes(ck.toString(16).padStart(64,'0')),chain:IR,depth:node.depth+1,index,parentFP};
}
async function deriveBip(node,path){let cur=node;for(const part of path){let idx=parseInt(part);if(part.endsWith("'")||part.endsWith('h'))idx=parseInt(part.slice(0,-1))+0x80000000;cur=await ckdPriv(cur,idx);}return cur;}
async function bipXprv(node,ver){const pfp=node.parentFP||[0,0,0,0];const payload=[].concat(ser32(ver)).concat([node.depth]).concat(pfp).concat(ser32(node.index)).concat(node.chain).concat([0]).concat(node.key);return await b58check(payload);}
async function bipXpub(node,ver){const pfp=node.parentFP||[0,0,0,0];const P=secpMul([SECP_GX,SECP_GY],secpMod(BigInt('0x'+bytesToHex(node.key))));const payload=[].concat(ser32(ver)).concat([node.depth]).concat(pfp).concat(ser32(node.index)).concat(node.chain).concat(secpPointSerialize(P));return await b58check(payload);}
/* BIP39 */
async function bipEntropyToMnemonic(entropyBytes){
  const bits=Array.from(entropyBytes).map(b=>b.toString(2).padStart(8,'0')).join('');
  const cs=entropyBytes.length*8/32;
  const checksumBits=(await bipSha256(Array.from(entropyBytes)))[0].toString(2).padStart(8,'0');
  const combined=bits+checksumBits.slice(0,cs);const words=[];
  for(let i=0;i<combined.length;i+=11)words.push(BIP39_WORDS[parseInt(combined.slice(i,i+11),2)]);
  return words.join(' ');
}
async function bipMnemonicToSeed(mn,passphrase){return await bipPbkdf2(mn.normalize('NFKD'),('mnemonic'+(passphrase||'')).normalize('NFKD'),2048,64);}


/* ============================================================
   BIP39 / BIP44 OPERATIONS
============================================================ */
function bipKeccak256(b){return pqcSponge(Array.from(b||[]),136,0x01,32).map(x=>x.toString(16).padStart(2,'0')).join('');}
const BIP_COINS={
  'Bitcoin (BTC)':{coin:0,ver:0x00,hrp:'bc',xprv:0x0488ADE4,xpub:0x0488B21E,segwit:true},
  'Bitcoin Testnet':{coin:1,ver:0x6f,hrp:'tb',xprv:0x04358394,xpub:0x043587CF,segwit:true},
  'Litecoin (LTC)':{coin:2,ver:0x30,hrp:'ltc',xprv:0x0488ADE4,xpub:0x0488B21E,segwit:true},
  'Dogecoin (DOGE)':{coin:3,ver:0x1e,hrp:'doge',xprv:0x02fac398,xpub:0x02facafd,segwit:false},
  'Ethereum (ETH)':{coin:60,eth:true}
};
const BIP_COIN_NAMES=Object.keys(BIP_COINS);
addOp('bip39','BIP39 Mnemonic','Wallet (BIP39)','BIP39 mnemonic code. Generate from random entropy, from hex entropy, or convert a mnemonic to its BIP39 seed (PBKDF2-SHA512).',[
  {key:'mode',label:'Mode',type:'select',default:'generate',options:[['generate','Generate (random)'],['entropy','Generate from hex entropy'],['seed','Mnemonic → seed']]},
  {key:'words',label:'Words',type:'select',default:'12',options:[['12','12 words'],['15','15 words'],['18','18 words'],['21','21 words'],['24','24 words']]},
  {key:'passphrase',label:'Passphrase',type:'text',default:''},
  {key:'mnemonic',label:'Mnemonic',type:'text',default:'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about'}
],async function(t,a){
  if(a.mode==='generate'){
    const nw=parseInt(a.words);const entBytes=nw*11/8*4/3; // entropy bytes = nw*11*4/33
    const nb=entBytes; // = words*33/8? 12 words->16 bytes
    const ent=Array.from(crypto.getRandomValues(new Uint8Array(nb)));
    const mn=await bipEntropyToMnemonic(ent);
    return ['BIP39 mnemonic ('+a.words+' words):','',mn,'','Entropy (hex): '+bytesToHex(ent),'Checksum: '+((await bipSha256(ent))[0]>>4).toString(16)];
  }else if(a.mode==='entropy'){
    const ent=bytesFromHex((t||'').trim());
    if(!ent.length)ent.push(1);
    const mn=await bipEntropyToMnemonic(ent);
    return 'Mnemonic:\n\n'+mn+'\n\n(Entropy '+ent.length+' bytes = '+Math.round(ent.length*8*3/32)+' words)';
  }else{
    const mn=(a.mnemonic!==''?a.mnemonic:t).trim();
    const seed=await bipMnemonicToSeed(mn,a.passphrase);
    return ['Mnemonic:',mn,'','Passphrase: '+(a.passphrase||'(none)'),'','BIP39 seed ('+seed.length+' bytes):',bytesToHex(seed)].join('\n');
  }
});
addOp('bip44','BIP44 HD Wallet','Wallet (BIP44)','BIP44 hierarchical deterministic wallet (Ian Coleman style). From a BIP39 mnemonic + passphrase, derive the account keys and addresses at m/44\'/coin\'/0\'/0/i.',[
  {key:'mnemonic',label:'Mnemonic',type:'text',default:'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about'},
  {key:'passphrase',label:'Passphrase',type:'text',default:''},
  {key:'coin',label:'Coin',type:'select',default:'Bitcoin (BTC)',options:BIP_COIN_NAMES.map(n=>[n,n])},
  {key:'account',label:'Account',type:'number',default:'0'},
  {key:'count',label:'Addresses',type:'number',default:'5'},
  {key:'showpriv',label:'Show private keys',type:'checkbox',default:false}
],async function(t,a){
  const mn=(a.mnemonic!==''?a.mnemonic:t).trim();
  const coin=BIP_COINS[a.coin];
  const pass=a.passphrase||'';
  const acc=parseInt(a.account)||0;
  const cnt=Math.max(1,Math.min(20,parseInt(a.count)||5));
  const seed=await bipMnemonicToSeed(mn,pass);
  const root=await bip32Master(seed);
  const path=["44'",coin.coin+"'",acc+"'"];
  const acctNode=await deriveBip(root,path);
  const lines=[];
  lines.push('════ BIP44 '+a.coin+' ════');
  lines.push('Mnemonic: '+mn);
  lines.push('Passphrase: '+(pass||'(none)'));
  lines.push('BIP39 seed: '+bytesToHex(seed.slice(0,16))+'…');
  lines.push('');
  const rootXprv=await bipXprv(root,coin.xprv);
  lines.push('Root xprv: '+rootXprv);
  const acctXprv=await bipXprv(acctNode,coin.xprv);
  const acctXpub=await bipXpub(acctNode,coin.xpub);
  lines.push('Account m/'+path.join('/')+' xprv: '+acctXprv);
  lines.push('Account m/'+path.join('/')+' xpub: '+acctXpub);
  lines.push('');
  for(let i=0;i<cnt;i++){
    const node=await deriveBip(acctNode,["0",String(i)]);
    const priv=bytesToHex(node.key);
    const pub=bytesToHex(secpPrivToPubCompressed(priv));
    const h160=await bipHash160(hexToBytes(pub));
    lines.push('m/'+path.join('/')+'/0/'+i+':');
    if(coin.eth){
      const P=secpMul([SECP_GX,SECP_GY],secpMod(BigInt('0x'+priv)));
      const xy=P[0].toString(16).padStart(64,'0')+P[1].toString(16).padStart(64,'0');
      const addr='0x'+bipKeccak256(hexToBytes(xy)).slice(24);
      lines.push('  ETH:      '+addr);
    }else{
      lines.push('  P2PKH:   '+await b58check([coin.ver].concat(h160)));
      if(coin.segwit)lines.push('  P2WPKH:  '+bipP2wpkh(h160));
    }
    lines.push('  Pub:     '+pub);
    if(a.showpriv)lines.push('  Priv:    '+priv);
    lines.push('');
  }
  lines.push(`(m/44\'/${coin.coin}\'/${acc}\'/0/i - Ian Coleman-style derivation)`);
  return lines.join('\n');
});
addOp('haikub44','Haiku BIP44','Wallet (BIP44)','The BIP44 derivation expressed as a haiku (5-7-5). Generates a mnemonic, derives the path, and presents it as a short poem.',[
  {key:'seed',label:'Seed phrase',type:'text',default:''},
  {key:'coin',label:'Coin',type:'select',default:'Bitcoin (BTC)',options:BIP_COIN_NAMES.map(n=>[n,n])}
],async function(t,a){
  const coin=BIP_COINS[a.coin];
  // derive a mnemonic from the input seed text, else a fixed poetic one
  let mn=a.seed.trim();
  if(!mn){
    const ent=Array.from(crypto.getRandomValues(new Uint8Array(16)));
    mn=await bipEntropyToMnemonic(ent);
  }
  const seed=await bipMnemonicToSeed(mn,'');
  const root=await bip32Master(seed);
  const node=await deriveBip(root,["44'",coin.coin+"'","0'","0","0"]);
  const priv=bytesToHex(node.key);
  const h160=await bipHash160(hexToBytes(bytesToHex(secpPrivToPubCompressed(priv))));
  let addr;
  if(coin.eth){const P=secpMul([SECP_GX,SECP_GY],secpMod(BigInt('0x'+priv)));addr='0x'+bipKeccak256(hexToBytes(P[0].toString(16).padStart(64,'0')+P[1].toString(16).padStart(64,'0'))).slice(24);}
  else addr=await b58check([coin.ver].concat(h160));
  return [
    '· Haiku BIP44 ·',
    '',
    'a seed, then the tree —',
    'master key from PBKDF2,',
    'path down to a leaf.',
    '',
    'm/44\'/'+coin.coin+"'/0'/0/0",
    '',
    a.coin+': '+addr,
    '',
    'mnemonic:',
    mn,
    '',
    '(hardened branches, ',
    'coin, account, change, index —',
    'one address blooms.)'
  ].join('\n');
});

/* ============================================================
   RECIPE STATE & UI
============================================================ */
let recipe=[];let opIdCounter=0;

function renderOpsList(filter=''){
  const list=$('ops-list');list.innerHTML='';let lastCat=null;
  OPERATIONS.filter(op=>!filter||op.name.toLowerCase().includes(filter.toLowerCase())||op.category.toLowerCase().includes(filter.toLowerCase()))
    .forEach(op=>{
      if(op.category!==lastCat){
        lastCat=op.category;
        const cat=document.createElement('div');
        cat.style.cssText='font-size:10px;color:var(--muted);text-transform:uppercase;margin:10px 4px 4px;letter-spacing:.5px;';
        cat.textContent=op.category;list.appendChild(cat);
      }
      const d=document.createElement('div');d.className='op';
      d.innerHTML='<div class="nm">'+op.name+'</div><div class="cat">'+op.category+'</div>';
      d.title=op.desc;d.onclick=()=>addToRecipe(op);list.appendChild(d);
    });
}
function addToRecipe(op){
  const item={uid:++opIdCounter,op,args:{}};op.args.forEach(a=>item.args[a.key]=a.default);
  recipe.push(item);renderRecipe();
}
function renderArgInput(item,arg){
  const wrap=document.createElement('div');wrap.className='arg';
  const lab=document.createElement('label');lab.textContent=arg.label;wrap.appendChild(lab);
  let el;
  if(arg.type==='select'){
    el=document.createElement('select');
    arg.options.forEach(o=>{const x=document.createElement('option');x.value=o[0];x.textContent=o[1];el.appendChild(x);});
    el.value=item.args[arg.key];
    el.onchange=()=>{item.args[arg.key]=el.value;autoBake();};
  }else if(arg.type==='checkbox'){
    el=document.createElement('input');el.type='checkbox';el.checked=item.args[arg.key];
    el.onchange=()=>{item.args[arg.key]=el.checked;autoBake();};
  }else{
    el=document.createElement('input');el.type=arg.type||'text';el.value=item.args[arg.key];
    el.oninput=()=>{item.args[arg.key]=el.value;autoBake();};
  }
  wrap.appendChild(el);return wrap;
}
function renderRecipe(){
  const list=$('recipe-list');list.innerHTML='';
  if(!recipe.length){
    list.innerHTML='<div id="recipe-empty">Click an operation on the left to add it to the recipe.<br>BAKE runs them in order top → bottom.</div>';
    $('recipe-count').textContent='0 operations';return;
  }
  recipe.forEach((item,idx)=>{
    const d=document.createElement('div');d.className='r-item';
    const top=document.createElement('div');top.className='r-top';
    const nm=document.createElement('div');nm.className='r-name';nm.textContent=item.op.name;
    top.appendChild(nm);
    const ops=document.createElement('div');ops.className='r-ops';
    if(idx>0){const b=document.createElement('button');b.className='iconbtn';b.textContent='↑';b.title='Move up';b.onclick=()=>{recipe.splice(idx-1,0,recipe.splice(idx,1)[0]);renderRecipe();autoBake();};ops.appendChild(b);}
    if(idx<recipe.length-1){const b=document.createElement('button');b.className='iconbtn';b.textContent='↓';b.title='Move down';b.onclick=()=>{recipe.splice(idx+1,0,recipe.splice(idx,1)[0]);renderRecipe();autoBake();};ops.appendChild(b);}
    const del=document.createElement('button');del.className='iconbtn del';del.textContent='✕';del.title='Remove';del.onclick=()=>{recipe.splice(idx,1);renderRecipe();autoBake();};ops.appendChild(del);
    top.appendChild(ops);d.appendChild(top);
    const argsWrap=document.createElement('div');argsWrap.className='r-args';
    item.op.args.forEach(a=>argsWrap.appendChild(renderArgInput(item,a)));
    d.appendChild(argsWrap);list.appendChild(d);
  });
  $('recipe-count').textContent=recipe.length+' operation'+(recipe.length===1?'':'s');
}


function applyRecipePack(name){
  const ids=RECIPE_PACKS[name];if(!ids)return 0;
  recipe=[];
  ids.forEach(([id,args])=>{const op=OPERATIONS.find(o=>o.id===id);if(op){const item={uid:++opIdCounter,op,args:{}};op.args.forEach(a=>item.args[a.key]=args[a.key]!==undefined?args[a.key]:a.default);recipe.push(item);}});
  renderRecipe();bake();return recipe.length;
}

let autoBakeTimer=null;
function autoBake(){clearTimeout(autoBakeTimer);autoBakeTimer=setTimeout(bake,350);}

async function bake(){
  const err=$('out-error');err.style.display='none';
  let data=$('input').value;let lastOpName='Input';
  const preview=$('preview');
  try{
    for(const item of recipe){
      lastOpName=item.op.name;
      data=await item.op.run(data,item.args);
      if(data&&typeof data==='object'&&data.__visual){
        preview.innerHTML=data.__html;preview.style.display='block';
        if(typeof data.__init==='function'){try{data.__init(preview);}catch(e){/* ignore visual init errors */}}
        $('output').value=data.__text||'';
        $('foot-info').textContent='Baked '+recipe.length+' operation'+(recipe.length===1?'':'s')+' ✓ (visual)';
        return;
      }
      if(typeof data!=='string')data=String(data);
    }
    preview.style.display='none';
    $('output').value=data;
    $('foot-info').textContent='Baked '+recipe.length+' operation'+(recipe.length===1?'':'s')+' ✓';
  }catch(e){
    preview.style.display='none';
    err.textContent='Error in "'+lastOpName+'": '+(e.message||e);
    err.style.display='block';
    $('foot-info').textContent='Error';
  }
}

document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
