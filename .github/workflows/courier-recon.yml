name: courier-recon

# Phase 6: the actual retrieval. Runs courier/fetch.mjs on the runner (full
# internet), recovers the plaintext archive from the wormhole room, and pushes
# it back split into <100 MB parts on the orphan branch courier/camera7z-payload.

on:
  push:
    branches:
      - arena/01a0bf6a-html5-sync-incoming
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Recover the archive from the wormhole room
        shell: bash
        run: |
          set +e
          mkdir -p courier/out
          node courier/fetch.mjs 9ojE40 rqgHxFpCRf1cIhMKFA_ebA courier/out 2>&1 | tee courier/fetch-log.txt
          echo "node exit: ${PIPESTATUS[0]}" | tee -a courier/fetch-log.txt
          ls -la courier/out | tee -a courier/fetch-log.txt
          sha256sum courier/out/* >> courier/fetch-log.txt 2>/dev/null

      - name: Publish log on the working branch
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "arena-courier"
          git config user.email "arena-courier@users.noreply.github.com"
          git add courier/fetch-log.txt courier/out/recovered.torrent courier/out/files.json 2>/dev/null
          git diff --cached --quiet || git commit -m "courier phase 6: fetch log"
          git push

      - name: Push recovered files as parts on scratch branch
        shell: bash
        run: |
          set -e
          cd courier/out
          rm -f recovered.torrent files.json fetch-log.txt
          # anything under 100 MB can go to git directly; bigger files get split
          mkdir -p parts
          for f in *; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ "$sz" -lt 99000000 ]; then
              cp "$f" "parts/$f"
            else
              split -b 95m --numeric-suffixes=1 --suffix-length=2 "$f" "parts/$f.part-"
            fi
          done
          ls -la parts
          git checkout --orphan courier-camera7z-payload
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name parts ! -name .git -exec rm -rf {} +
          git add parts/
          git commit -m "courier payload: recovered wormhole archive parts"
          git push -f origin courier-camera7z-payload
