name: courier-recon

# Temporary reconnaissance for the Camera.7z retrieval task (wormhole link).
# Phase 4: commit ALL chunks for offline analysis + probe /api/info etc.
# NOTE: default GH shell is `bash -eo pipefail`; we disable that and rely on
# explicit error capture so one empty grep cannot kill the job.

on:
  push:
    branches:
      - arena/01a0bf6a-html5-sync-incoming
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch all chunks and probe room APIs
        shell: bash
        run: |
          set +e
          set -x
          exec > >(tee -a courier/diag.txt) 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          rm -rf courier/tmp courier/js; mkdir -p courier/tmp courier/js
          BUILD=$(grep -oE '/_next/static/[A-Za-z0-9_-]{10,}/_buildManifest' courier/page.html | head -1 | cut -d/ -f4)
          echo "BUILD=$BUILD"
          curl -sS -m 60 -o courier/tmp/_buildManifest.js "https://wormhole.app/_next/static/$BUILD/_buildManifest.js"
          cp courier/tmp/_buildManifest.js courier/js/
          # every chunk referenced anywhere in the manifest (all routes)
          grep -oE '"static/chunks/[^"]+\.js"' courier/tmp/_buildManifest.js | tr -d '"' | sort -u > courier/tmp/refs.txt
          grep -oE '"/_next/static/chunks/[^"]+\.js"' courier/page.html | tr -d '"' >> courier/tmp/refs.txt
          sort -u courier/tmp/refs.txt -o courier/tmp/refs.txt
          sed -i 's#^static#/static#' courier/tmp/refs.txt
          wc -l courier/tmp/refs.txt; cat courier/tmp/refs.txt
          while read -r ref; do
            case "$ref" in
              /_next/*) url="https://wormhole.app$ref" ;;
              /static/*) url="https://wormhole.app/_next$ref" ;;
              *) continue ;;
            esac
            out="courier/tmp/$(echo "$ref" | sed 's#/#_#g; s#^_##')"
            curl -sS -m 120 -o "$out" "$url" || echo "FAILED $url"
          done < courier/tmp/refs.txt
          ls -la courier/tmp | head -80
          cp courier/tmp/* courier/js/ 2>/dev/null
          echo "=== API probes ==="
          probe() { echo "### $*"; curl -sS -m 60 -A "$UA" "$@" | head -c 2000 | cat -v; echo; echo; }
          probe -X POST -H "Content-Type: application/json" -d '{"id":"9ojE40"}' https://wormhole.app/api/info
          probe -X POST -H "Content-Type: application/json" -d '{"roomId":"9ojE40"}' https://wormhole.app/api/info
          probe -X POST -H "Content-Type: application/json" -d '{"roomCode":"9ojE40"}' https://wormhole.app/api/info
          probe -X POST -H "Content-Type: application/json" -d '{"code":"9ojE40"}' https://wormhole.app/api/info
          probe -X GET "https://wormhole.app/api/info?id=9ojE40"
          probe -X GET "https://wormhole.app/api/info/9ojE40"
          probe -X POST -H "Content-Type: application/json" -d '{"roomId":"9ojE40"}' https://wormhole.app/api/check
          probe -X POST -H "Content-Type: application/json" -d '{"roomId":"9ojE40"}' https://wormhole.app/api/subscribe
          probe -X GET "https://wormhole.app/api/check"
          echo "=== room page HTML ==="
          curl -sS -m 60 -A "$UA" -o courier/room-page.html "https://wormhole.app/9ojE40"
          grep -c roomId courier/room-page.html
          echo "ALL-STEPS-DONE"

      - name: Commit recon results
        if: always()
        shell: bash
        run: |
          set +e
          rm -rf courier/tmp
          git config user.name "arena-courier"
          git config user.email "arena-courier@users.noreply.github.com"
          git add courier/
          git diff --cached --quiet || git commit -m "courier recon phase 4: all chunks + room API probes"
          git push
