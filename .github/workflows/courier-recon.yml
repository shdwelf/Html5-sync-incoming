name: courier-recon

# Temporary reconnaissance for the Camera.7z retrieval task (wormhole link).
# Phase 3: robust retry of chunk fetch + API probes; every step self-reports
# into courier/diag.txt because the sandbox cannot read Actions logs.

on:
  push:
    branches:
      - arena/01a0bf6a-html5-sync-incoming
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch chunks + probe APIs
        shell: bash
        run: |
          set -x
          exec > >(tee -a courier/diag.txt) 2>&1
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
          mkdir -p courier/tmp courier/js
          BUILD=$(grep -oE '/_next/static/[A-Za-z0-9_-]{10,}/_buildManifest' courier/page.html | head -1 | cut -d/ -f4)
          echo "BUILD=$BUILD"
          curl -sS -m 60 -o courier/tmp/_buildManifest.js "https://wormhole.app/_next/static/$BUILD/_buildManifest.js" || echo "manifest fetch failed"
          head -c 800 courier/tmp/_buildManifest.js; echo
          grep -oE '"/_next/static/chunks/[^"]+\.js"' courier/page.html | tr -d '"' | sort -u > courier/tmp/refs.txt
          grep -oE '"/_next/static/chunks/[^"]+\.js"' courier/tmp/_buildManifest.js | tr -d '"' >> courier/tmp/refs.txt || true
          sort -u courier/tmp/refs.txt -o courier/tmp/refs.txt
          wc -l courier/tmp/refs.txt
          n=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            n=$((n+1))
            curl -sS -m 120 -o "courier/tmp/$(basename "$ref")" "https://wormhole.app$ref" || echo "FAILED $ref"
          done < courier/tmp/refs.txt
          ls -la courier/tmp/ | head -60
          echo "=== api refs ==="
          grep -rhoE '"/?api/[A-Za-z0-9/_.-]+"' courier/tmp/ 2>/dev/null | sort -u | tee courier/api-refs.txt | head -80
          echo "=== crypto chunks ==="
          grep -rlE 'AES-GCM|crypto\.subtle|importKey|decrypt' courier/tmp/ 2>/dev/null | tee courier/crypto-chunks.txt
          cp courier/tmp/_buildManifest.js courier/js/ 2>/dev/null || true
          total=0
          while read -r f; do
            [ -f "$f" ] || continue
            sz=$(stat -c%s "$f")
            if [ $((total+sz)) -lt 9000000 ]; then cp "$f" courier/js/; total=$((total+sz)); fi
          done < courier/crypto-chunks.txt
          echo "=== wormhole API probes ==="
          for u in \
            "https://wormhole.app/api/file/9ojE40" \
            "https://wormhole.app/api/get-file/9ojE40" \
            "https://wormhole.app/api/download/9ojE40" \
            "https://wormhole.app/api/9ojE40" ; do
            echo "### GET $u"
            curl -sS -m 60 -A "$UA" -D - -o /tmp/body.bin "$u" | head -15
            head -c 300 /tmp/body.bin | cat -v; echo; echo
          done
          echo "=== filemail probes ==="
          echo "### GET d page with JSON accept"
          curl -sS -m 60 -A "$UA" -H "Accept: application/json" -D - -o /tmp/fm1 "https://app.filemail.com/d/ejnckrllfvcoenb" | head -20
          head -c 400 /tmp/fm1 | cat -v; echo
          echo "### POST getdownloadurl"
          curl -sS -m 60 -A "$UA" -X POST -H "Content-Type: application/x-www-form-urlencoded" -d "downloadkey=ejnckrllfvcoenb" -D - -o /tmp/fm2 "https://app.filemail.com/api/download/getdownloadurl" | head -20
          head -c 600 /tmp/fm2 | cat -v; echo
          echo "ALL-STEPS-DONE"

      - name: Commit recon results
        if: always()
        shell: bash
        run: |
          rm -rf courier/tmp
          git config user.name "arena-courier"
          git config user.email "arena-courier@users.noreply.github.com"
          git add courier/
          git diff --cached --quiet || git commit -m "courier recon phase 3: chunks, API probes, diag"
          git push
