name: courier-recon

# Temporary reconnaissance for the Camera.7z retrieval task (wormhole link).
# Phase 5: fetch the nine dynamically-imported webpack chunks (from the
# webpack runtime chunk map) that carry the room/transfer client.

on:
  push:
    branches:
      - arena/01a0bf6a-html5-sync-incoming
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch dynamic chunks
        shell: bash
        run: |
          set +e
          exec > >(tee -a courier/diag.txt) 2>&1
          mkdir -p courier/js2
          base="https://wormhole.app/_next/static/chunks"
          for c in \
            "297.eedd867e90026c71" \
            "1379.b98a43266ca92e2c" \
            "fec483df.e9e3445d650f7fdd" \
            "fb7d5399.d366e817b93124a7" \
            "5626.8e8fff96c110de2f" \
            "5892.142b55654e839fb6" \
            "9060.59325fcbfe21e0d7" \
            "9361.afdadd55cb17aa3b" \
            "9894.15572e540f824c31" ; do
            curl -sS -m 180 -o "courier/js2/$c.js" "$base/$c.js" || echo "FAILED $c"
          done
          ls -la courier/js2
          echo "=== url-ish strings ==="
          grep -rhoE '"/[a-z][a-z0-9/_-]{2,40}"|`/[a-z][^`]{2,60}`' courier/js2 | sort -u | head -60
          echo DONE5

      - name: Commit
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "arena-courier"
          git config user.email "arena-courier@users.noreply.github.com"
          git add courier/
          git diff --cached --quiet || git commit -m "courier recon phase 5: dynamic webpack chunks"
          git push
